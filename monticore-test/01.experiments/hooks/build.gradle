plugins {
  // provides a convenient way to have multiple test suites
  id 'jvm-test-suite'
}

dependencies {
  implementation project(":monticore-test:01experiments:automaton")
  implementation project(":monticore-test:01experiments:templates")
}

// create an additional test suite called productTest
testing {
  suites {
    test {
      useJUnitJupiter()
    }

    productTest(JvmTestSuite) {
      dependencies {
        implementation project()
        implementation testFixtures(project(":monticore-runtime"))
      }
      sources {
        java.srcDirs += ["$buildDir/statepattern" , "$projectDir/src/product/java"]
      }
    }
  }
}

// let check depend on productTest such that it is included in the build
tasks.named('check') {
  dependsOn(testing.suites.productTest)
}

dependencies {
  productTestImplementation(project(":monticore-runtime-tests"))
}

// let productTest depend on test as test produces code for productTest
tasks.named("compileProductTestJava") {
  dependsOn(test)
}

test.configure {
  // The test task builds the productTest inputs
  // Disable build cache & up to date check
  outputs.cacheIf {false}
  outputs.upToDateWhen {false}
}
