/* (c) https://github.com/MontiCore/monticore */
plugins {
  id "de.rwth.se.symtabdefinition" version "$previous_mc_version"
  // use previous_mc_version to avoid bootstrapping issue
}

description = 'MontiCore: Temporal Symbols'

// add generated symbols to jar
jar {
  from generateSymbolTables
}

sourcesJar {
  // exclude generated files
  exclude("**/*.symtabdefinitionsym")
  // exclude the symbols only required to generate the symbol tables
  exclude("String.sym")
}

dependencies {
  stdefTool("de.monticore.lang:cd4analysis:$previous_mc_version") // TODO: backport this fix into the CD4A plugin
  stdefTool("de.monticore.lang.cd4analysis:stdefgradle:$previous_mc_version") // TODO: backport this fix into the CD4A plugin
}

// String.sym provides the String symbol of BasicSymbolsMill.initializeString()
// to the SymTabDefinitionTool, which does not add it itself;
// it is only required to generate the symbol tables
// (which reference it by the name "String" only),
// thus, it is not exported.
// (added as input, as the symbolPath of the plugin
// passes the paths prefixed with a space, i.e., invalid)
generateSymbolTables {
  input.from("src/main/resources/String.sym")
}

processResources {
  exclude("String.sym")
}
