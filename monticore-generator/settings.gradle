pluginManagement {
  repositories {
    mavenCentral()
    if(("true").equals(getProperty('useLocalRepo'))){
      mavenLocal()
    }
    maven {
      url = repo
    }
  
    gradlePluginPortal()
  }
}
plugins {
  id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = 'monticore-generator'
include "gradle-plugin"
